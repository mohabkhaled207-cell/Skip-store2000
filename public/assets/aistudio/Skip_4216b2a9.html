<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Skip</title>
<meta data-keep name="claude:viewport-fit-sides" content="cover">
<link data-keep rel="preconnect" href="https://fonts.googleapis.com">
<link data-keep rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link data-keep rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<style data-keep id="app-style">
/* Layout: sticky header, light-blue hero with a fan of real outfit photos, 3:4 catalog grid like hang-tagged flat-lays, branch + contact panels. Owner tools sit in a fixed bottom bar. */
:root{
  --bg:#F3F9FD; --surface:#FFFFFF; --ink:#0F2233; --muted:#566B7D; --line:#D5E6F2;
  --brand:#62BBEA; --brand-ink:#08202F; --brand-deep:#0F6FA8; --brand-soft:#DDF0FB;
  --warn:#B45309; --danger:#B42318; --veil:rgba(8,20,30,.55);
  --shadow:0 1px 2px rgba(15,34,51,.06),0 10px 28px rgba(15,34,51,.10);
  --f-brand:"Playfair Display",Georgia,"Times New Roman",serif;
  --f-body:"Readex Pro","Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1520; --surface:#111F2C; --ink:#E7F2FA; --muted:#92A9BA; --line:#1F3445;
    --brand:#6FC5F2; --brand-ink:#07202F; --brand-deep:#8DD2F7; --brand-soft:#14293A;
    --warn:#F2B35A; --danger:#FF8A80; --veil:rgba(0,0,0,.65);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1520; --surface:#111F2C; --ink:#E7F2FA; --muted:#92A9BA; --line:#1F3445;
  --brand:#6FC5F2; --brand-ink:#07202F; --brand-deep:#8DD2F7; --brand-soft:#14293A;
  --warn:#F2B35A; --danger:#FF8A80; --veil:rgba(0,0,0,.65);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);pointer-events:none}
a{color:var(--brand-deep)}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand-deep);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.site{min-height:100%}
.site.is-admin{padding-bottom:190px}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;border:1px solid transparent;font-weight:600;font-size:15px;line-height:1;cursor:pointer;text-decoration:none;background:none;transition:filter .15s,transform .15s}
.btn svg{flex:none}
.btn-brand{background:var(--brand);color:var(--brand-ink)}
.btn-line{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn-sm{min-height:40px;padding:0 16px;font-size:14px}
.btn:hover{filter:brightness(.96)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.6;cursor:default}
.icon-btn{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink);border:0;cursor:pointer;text-decoration:none}
.icon-btn:hover{filter:brightness(.95)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;min-height:66px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.mark{display:block;height:44px;border-radius:10px;overflow:hidden;flex:none;background:#1230C8}
.mark img{display:block;height:100%;width:auto;max-width:110px;object-fit:contain}
.mark.mono{display:grid;place-items:center;width:44px;background:var(--brand);color:var(--brand-ink);font:800 22px var(--f-brand)}
.brand-name{font-family:var(--f-brand);font-weight:800;font-size:28px;letter-spacing:.01em;line-height:1}
.nav{margin-inline-start:auto;display:flex;gap:4px}
.nav a{padding:8px 14px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:500;font-size:15px}
.nav a:hover{background:var(--brand-soft);color:var(--ink)}
@media (max-width:640px){.nav{display:none}.top-in>.btn{margin-inline-start:auto}}

/* hero */
.hero{background:var(--brand-soft);border-bottom:1px solid var(--line)}
.hero-in{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center;padding-block:48px}
@media (max-width:820px){.hero-in{grid-template-columns:1fr;gap:28px;padding-block:28px 36px}}
.eyebrow{margin:0;font-size:14px;font-weight:600;color:var(--brand-deep)}
.hero h1{margin:10px 0 12px;font-size:clamp(30px,5.6vw,54px);line-height:1.22;font-weight:700;text-wrap:balance}
.hero-sub{margin:0;color:var(--muted);font-size:17px;max-width:46ch}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.fact{padding:6px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:500}
.fan{position:relative;width:100%;max-width:440px;aspect-ratio:1/.95;margin-inline:auto}
.fan img{position:absolute;width:54%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;border:4px solid var(--surface);box-shadow:var(--shadow);background:var(--surface)}
.fan .fi1{inset-inline-end:2%;top:8%;transform:rotate(5deg)}
.fan .fi2{inset-inline-start:2%;top:2%;transform:rotate(-5deg)}
.fan .fi3{left:50%;bottom:0;transform:translateX(-50%) rotate(1.5deg);z-index:2}
.fan.f1 .fi1{inset-inline-end:auto;left:50%;top:0;width:62%;transform:translateX(-50%) rotate(2deg)}
.fan-logo{display:grid;place-items:center}
.fan-logo .mark{height:120px}
.fan-logo .mark img{max-width:240px}

/* sections */
.sec{padding-block:48px;scroll-margin-top:76px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sec-head h2,.visit h2{margin:0;font-size:clamp(23px,3.6vw,32px);line-height:1.3;font-weight:700}
.sec-head p{margin:4px 0 0;color:var(--muted);max-width:52ch}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px}
.chip{flex:none;min-height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:14px}
@media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}}
.card{position:relative;display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:transform .18s,box-shadow .18s}
@media (hover:hover){.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}}
.card-img{position:relative;display:block;width:100%;aspect-ratio:3/4;padding:0;border:0;background:var(--brand-soft);cursor:pointer;overflow:hidden}
.card-img img{display:block;width:100%;height:100%;object-fit:cover}
.is-sold .card-img img{filter:grayscale(.7) opacity(.65)}
.ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--brand-deep);opacity:.7}
.sold{position:absolute;top:10px;inset-inline-start:10px;padding:3px 12px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600}
.edit-chip{position:absolute;top:10px;inset-inline-end:10px;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:0;background:var(--brand);color:var(--brand-ink);font-size:13px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.card-body{display:flex;flex-direction:column;gap:6px;padding:12px;flex:1}
.cat{font-size:12.5px;color:var(--muted)}
.card-name{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding:0;border:0;background:none;text-align:start;font-size:15px;font-weight:600;line-height:1.45;cursor:pointer}
.card-foot{display:flex;flex-direction:column;align-items:stretch;gap:8px;margin-top:auto;padding-top:6px}
.card-foot .tag{align-self:flex-start;max-width:100%}
.card-foot .btn{width:100%;min-height:40px}
.tag{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;background:var(--brand-soft);border:1px solid var(--line);color:var(--brand-deep);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;border:2px solid currentColor;opacity:.65}
.tag.ask{color:var(--muted);font-weight:500;font-size:13px}
.empty{padding:36px 20px;text-align:center;border:1px dashed var(--line);border-radius:var(--r);background:var(--surface);color:var(--muted)}
.empty .btn{margin-top:14px}

/* visit */
.visit-band{background:var(--surface);border-top:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.panel{min-width:0;padding:22px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.panel h3{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:18px}
.panel h3 svg{color:var(--brand-deep)}
.addr{margin:0 0 16px;font-size:16.5px;line-height:1.8}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.links{display:flex;flex-direction:column;gap:10px}
.row-link{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-decoration:none;min-width:0;transition:border-color .15s}
.row-link:hover{border-color:var(--brand)}
.ico{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink)}
.rl-txt{min-width:0;flex:1}
.t1{font-weight:600;line-height:1.3}
.t2{color:var(--muted);font-size:14px;direction:ltr;unicode-bidi:plaintext;text-align:start;overflow-wrap:anywhere}
.chev{flex:none;color:var(--muted)}
.copy-line{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--muted)}
.copy-line b{color:var(--ink);font-weight:600;direction:ltr;unicode-bidi:plaintext;user-select:all}
.foot{border-top:1px solid var(--line);padding-block:22px;color:var(--muted);font-size:14px}
.foot-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.lock{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;border-radius:8px}
.lock:hover{color:var(--ink);background:var(--brand-soft)}

/* admin bar */
.abar{position:fixed;inset:auto 0 0 0;z-index:40;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--bg);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.astat{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;width:100%;justify-content:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--warn);display:inline-block}
.abtn{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;border-radius:999px;border:1px solid rgba(127,127,127,.55);background:transparent;color:inherit;font-size:14px;font-weight:600;cursor:pointer}
.abtn.primary{background:var(--brand);border-color:transparent;color:var(--brand-ink)}
.abtn[disabled]{opacity:.6;cursor:default}
@media (min-width:700px){.astat{width:auto;margin-inline-end:8px}}

/* modals */
.ovl{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:var(--veil)}
@media (min-width:700px){.ovl{align-items:center;padding:24px}}
.sheet{position:relative;width:100%;max-width:520px;max-height:92%;overflow:auto;background:var(--surface);color:var(--ink);border-radius:20px 20px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
@media (min-width:700px){.sheet{border-radius:20px}}
.sheet.wide{max-width:860px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.sheet-h h3{margin:0;font-size:20px}
.x{flex:none;width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--brand-soft);cursor:pointer}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.lbl{font-weight:600;font-size:14px}
.field small{color:var(--muted);font-size:12.5px}
.field input[type="text"],.field input[type="password"],.field textarea{width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.field textarea{resize:vertical;min-height:80px;line-height:1.6}
.check{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-weight:500;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--brand-deep)}
.imgrow{display:flex;align-items:center;gap:14px}
.prev{width:96px;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand-deep);flex:none}
.prev img{width:100%;height:100%;object-fit:cover;display:block}
.prev.logo{aspect-ratio:auto;width:auto;min-width:88px;height:56px;background:#1230C8}
.prev.logo img{width:auto;max-width:150px;object-fit:contain}
.err{min-height:1.4em;margin:0 0 10px;color:var(--danger);font-size:14px;font-weight:500}
.sheet-f{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.det{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:700px){.det{grid-template-columns:.9fr 1.1fr;gap:26px;align-items:start}}
.det-img{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:3/4;background:var(--brand-soft)}
.det-img img{width:100%;height:100%;object-fit:cover;display:block}
.det h3{margin:6px 0 10px;font-size:22px;line-height:1.4}
.det dl{margin:14px 0 18px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.det dt{color:var(--muted)}
.det dd{margin:0;font-weight:500}
.toast{position:fixed;inset-inline:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:max-content;max-width:calc(100% - 32px);z-index:60;padding:11px 18px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;text-align:center;box-shadow:var(--shadow)}
.is-admin ~ .toast{bottom:calc(120px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:reduce){.card,.btn,.row-link{transition:none}.card:hover{transform:none}}
</style>

/* ---------- images ---------- */
function fileToDataUrl(file,maxSide,mime,q){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej(new Error('read'));};
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){rej(new Error('img'));};
      img.onload=function(){
        var w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,maxSide/Math.max(w,h));
        w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
        var c=document.createElement('canvas');c.width=w;c.height=h;
        var x=c.getContext('2d');
        if(mime==='image/jpeg'){x.fillStyle='#ffffff';x.fillRect(0,0,w,h);}
        x.drawImage(img,0,0,w,h);
        res(c.toDataURL(mime,q));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function sha256(s){
  var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,'0');}).join('');
}

  var v=(($('#pw')||{}).value||'').trim(),h='';
  try{h=await sha256(PW_SALT+v);}catch(e){formErr('المتصفح ده مش قادر يتحقق من الباسورد.');return;}
  if(h===PW_HASH){ui.admin=true;ui.pwFails=0;closeModal();renderAll();toast('وضع التعديل شغال');}
  else{ui.pwFails++;if(ui.pwFails>=5){ui.pwLock=now+30000;ui.pwFails=0;}formErr('الباسورد غلط');}
}

var FALLBACK_RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';

  try{var st=Array.prototype.slice.call(document.head.querySelectorAll('style')).filter(function(s){return !s.hasAttribute('data-keep')&&/safe-area-inset/.test(s.textContent)&&/\[hidden\]/.test(s.textContent);})[0];if(st)return st.textContent;}catch(e){}
  return FALLBACK_RESET;
}
function buildDoc(){
  var src=document.getElementById('app-script').textContent,a=src.indexOf(M1),b=src.indexOf(M2);
  if(a<0||b<a)throw new Error('source');
  var json=JSON.stringify(STATE).replace(/</g,'\\u003c');
  src=src.slice(0,a+M1.length)+'\nconst STATE = '+json+';\n'+src.slice(b);
  var keep=Array.prototype.map.call(document.querySelectorAll('[data-keep]'),function(n){return n.outerHTML;}).join('\n');
  var body='<title>'+esc(STATE.settings.name)+'</title>\n'+keep+'\n<div id="root" class="site" dir="rtl" lang="ar"></div>\n<script id="app-script">'+src+'</scr'+'ipt>\n';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+platformReset()+'</style></head><body>'+body+'</body></html>';
}
async function publish(){
  if(ui.busy)return;
  if(!ui.dirty){toast('مفيش تعديلات جديدة تتنشر.');return;}
  ui.busy=true;renderBar();
  try{
    var art=window.claude&&window.claude.use?await window.claude.use('artifact'):null;
    if(!art){ui.busy=false;renderBar();toast('النشر مش شغال من الجهاز ده. افتح الصفحة من حساب Claude بتاعك.',4800);return;}
    var html=buildDoc();
    if(html.length>15*1024*1024){ui.busy=false;renderBar();toast('الصور كتيرة أوي. قلل عددها وجرب تاني.',4200);return;}
    toast('بنحفظ التعديلات…',6000);
    await art.publish(html);
    toast('اتنشرت. الصفحة بتتحدث…',6000);
  }catch(err){
    ui.busy=false;renderBar();
    var c=err&&err.code;
    if(c==='conflict')return;
    toast(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'||c==='not_declared'?'الحساب ده مش مسموح له يحفظ. افتح الصفحة من حساب صاحب الستور على Claude.':
      c==='too_large'?'حجم الصفحة كبير أوي. قلل عدد الصور وجرب تاني.':
      c==='rate_limited'?'استنى شوية وجرب تاني.':'حصلت مشكلة وقت الحفظ. جرب تاني.',5200);
  }
}

function copyText(t){
  function fallback(){
    var ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;opacity:0;top:0';
    document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();
    toast(ok?'اتنسخ':'انسخه يدوي من هنا: '+t,ok?1800:5000);
  }
  try{navigator.clipboard.writeText(t).then(function(){toast('اتنسخ',1800);},fallback);}catch(e){fallback();}
}
function goTo(id){
  var b=reduced()?'auto':'smooth';

  var el=document.getElementById(id);if(el)el.scrollIntoView({behavior:b,block:'start'});

function onClick(e){
  if(e.target.classList&&e.target.classList.contains('ovl')){closeModal();return;}
  var el=e.target.closest&&e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,id=el.dataset.id;
  switch(a){
    case 'go':e.preventDefault();goTo(el.dataset.to);break;
    case 'filter':ui.filter=el.dataset.cat;renderCatalog();break;
    case 'detail':{var p=STATE.products.filter(function(x){return x.id===id;})[0];if(p)openModal('detail',p);break;}
    case 'copy':copyText(el.dataset.text);break;
    case 'close':closeModal();break;
    case 'unlock':openModal('pw');break;
    case 'pw-ok':tryPw();break;
    case 'add':openProduct(null);break;
    case 'edit':openProduct(id);break;
    case 'save-prod':saveProduct();break;
    case 'del-prod':delProduct();break;
    case 'settings':openModal('settings',Object.assign({},STATE.settings));break;
    case 'save-settings':saveSettings();break;
    case 'publish':publish();break;
    case 'exit':exitAdmin();break;
  }
}

  var t=e.target;if(!t||!t.dataset||!ui.form)return;
  if(t.dataset.img){
    var key=t.dataset.img,file=t.files&&t.files[0];if(!file)return;
    try{
      var logo=key==='logo',mime=logo&&file.type==='image/png'?'image/png':'image/jpeg';
      var url=await fileToDataUrl(file,logo?480:1000,mime,logo?0.9:0.78);
      ui.form[key]=url;var pv=$('#prev-'+key);if(pv)pv.innerHTML='<img src="'+url+'" alt="">';
      formErr('');
    }catch(err){formErr('الصورة دي مش راضية تفتح. جرّب صورة تانية.');}
    t.value='';return;
  }
  if(t.dataset.f&&t.type==='checkbox')ui.form[t.dataset.f]=t.checked;
}
function onInput(e){
  var t=e.target;if(!t||!t.dataset||!t.dataset.f||!ui.form||t.type==='checkbox')return;
  ui.form[t.dataset.f]=t.value;
}
function onKey(e){
  if(e.key==='Escape'&&ui.modal){closeModal();return;}
  if(e.key==='Enter'&&e.target&&e.target.id==='pw'){e.preventDefault();tryPw();}
}

function init(){
  var root=$('#root');
  root.innerHTML='<div id="r-top"></div><main id="r-main"></main><div id="r-bar"></div>';
  layer=document.createElement('div');layer.id='layer';layer.setAttribute('dir','rtl');layer.setAttribute('lang','ar');document.body.appendChild(layer);
  toastEl=document.createElement('div');toastEl.className='toast';toastEl.setAttribute('role','status');toastEl.setAttribute('dir','rtl');toastEl.hidden=true;document.body.appendChild(toastEl);
  document.addEventListener('click',onClick);
  document.addEventListener('change',onChange);
  document.addEventListener('input',onInput);
  document.addEventListener('keydown',onKey);
  renderAll();
}
init();
})();
</script>

</body></html>
